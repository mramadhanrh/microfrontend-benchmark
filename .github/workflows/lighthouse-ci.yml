name: Lighthouse CI

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Custom base URL to benchmark (leave empty to use default)"
        required: false
        type: string
      project:
        description: "Project type being benchmarked"
        required: true
        type: choice
        default: "mfe"
        options:
          - mfe
          - monolith
      mode:
        description: "Benchmark mode"
        required: false
        type: choice
        default: "cold"
        options:
          - cold
          - warm
          - both
      network:
        description: "Network throttling profile"
        required: false
        type: choice
        default: "none"
        options:
          - none
          - 4g
          - 3g
          - all
      page:
        description: "Page to benchmark"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - home
          - login
          - dashboard

env:
  DEFAULT_BENCHMARK_URL: "http://13.229.66.196"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      page-matrix: ${{ steps.set-pages.outputs.matrix }}
      network-matrix: ${{ steps.set-networks.outputs.matrix }}
    steps:
      - name: Determine page matrix
        id: set-pages
        run: |
          PAGE="${{ inputs.page || 'all' }}"
          if [ "$PAGE" = "all" ]; then
            echo 'matrix=[{"name":"home","path":"/"},{"name":"login","path":"/login"},{"name":"dashboard","path":"/dashboard"}]' >> "$GITHUB_OUTPUT"
          elif [ "$PAGE" = "home" ]; then
            echo 'matrix=[{"name":"home","path":"/"}]' >> "$GITHUB_OUTPUT"
          elif [ "$PAGE" = "login" ]; then
            echo 'matrix=[{"name":"login","path":"/login"}]' >> "$GITHUB_OUTPUT"
          elif [ "$PAGE" = "dashboard" ]; then
            echo 'matrix=[{"name":"dashboard","path":"/dashboard"}]' >> "$GITHUB_OUTPUT"
          fi

      - name: Determine network matrix
        id: set-networks
        run: |
          NETWORK="${{ inputs.network || 'none' }}"
          if [ "$NETWORK" = "all" ]; then
            echo 'matrix=["none","4g","3g"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"${NETWORK}\"]" >> "$GITHUB_OUTPUT"
          fi

  lighthouse:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        instance: [1, 2, 3, 4, 5, 6]
        page: ${{ fromJSON(needs.setup.outputs.page-matrix) }}
        network: ${{ fromJSON(needs.setup.outputs.network-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: tools/web-vitals-benchmark
        run: bun install

      - name: Set benchmark URL
        id: set-url
        run: |
          if [ -n "${{ inputs.url }}" ]; then
            BASE_URL="${{ inputs.url }}"
          else
            BASE_URL="${{ env.DEFAULT_BENCHMARK_URL }}"
          fi
          PAGE_PATH="${{ matrix.page.path }}"
          # Remove trailing slash from base URL to avoid double slashes
          BASE_URL="${BASE_URL%/}"
          FULL_URL="${BASE_URL}${PAGE_PATH}"
          echo "url=${FULL_URL}" >> "$GITHUB_OUTPUT"

      - name: Run Lighthouse CI (${{ matrix.page.name }} - ${{ matrix.network }} - Instance ${{ matrix.instance }})
        working-directory: tools/web-vitals-benchmark
        env:
          NX_BENCHMARK_URL: ${{ steps.set-url.outputs.url }}
        run: |
          echo "Benchmark URL: $NX_BENCHMARK_URL"
          echo "Page: ${{ matrix.page.name }}"
          echo "Network: ${{ matrix.network }}"
          MODE="${{ inputs.mode || 'cold' }}"
          echo "Mode: $MODE"

          # Set network throttling profile if not "none"
          if [ "${{ matrix.network }}" != "none" ]; then
            export NX_NETWORK_PROFILE="${{ matrix.network }}"
            echo "NX_NETWORK_PROFILE: $NX_NETWORK_PROFILE"
          fi

          if [ "$MODE" = "both" ]; then
            echo "--- Running cold start ---"
            bun run lighthouse:cold || true
            mkdir -p .lighthouseci-cold
            cp .lighthouseci/* .lighthouseci-cold/ 2>/dev/null || true
            rm -rf .lighthouseci

            echo "--- Running warm start ---"
            bun run lighthouse:warm || true
            mkdir -p .lighthouseci-warm
            cp .lighthouseci/* .lighthouseci-warm/ 2>/dev/null || true
            rm -rf .lighthouseci
          elif [ "$MODE" = "warm" ]; then
            bun run lighthouse:warm
          else
            bun run lighthouse:cold
          fi
        continue-on-error: true

      - name: Upload Lighthouse results (single mode)
        uses: actions/upload-artifact@v4
        if: always() && inputs.mode != 'both'
        with:
          name: lighthouse-results-${{ matrix.page.name }}-${{ matrix.network }}-${{ matrix.instance }}
          path: tools/web-vitals-benchmark/.lighthouseci/
          include-hidden-files: true
          retention-days: 1

      - name: Upload cold results
        uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'both'
        with:
          name: lighthouse-cold-results-${{ matrix.page.name }}-${{ matrix.network }}-${{ matrix.instance }}
          path: tools/web-vitals-benchmark/.lighthouseci-cold/
          include-hidden-files: true
          retention-days: 1

      - name: Upload warm results
        uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'both'
        with:
          name: lighthouse-warm-results-${{ matrix.page.name }}-${{ matrix.network }}-${{ matrix.instance }}
          path: tools/web-vitals-benchmark/.lighthouseci-warm/
          include-hidden-files: true
          retention-days: 1

  aggregate-results:
    runs-on: ubuntu-latest
    needs: [setup, lighthouse]
    if: always() && inputs.mode != 'both'
    strategy:
      matrix:
        page: ${{ fromJSON(needs.setup.outputs.page-matrix) }}
        network: ${{ fromJSON(needs.setup.outputs.network-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: tools/web-vitals-benchmark
        run: bun install

      - name: Download artifacts for ${{ matrix.page.name }} (${{ matrix.network }})
        uses: actions/download-artifact@v4
        with:
          pattern: lighthouse-results-${{ matrix.page.name }}-${{ matrix.network }}-*
          path: lighthouse-artifacts

      - name: Merge results for ${{ matrix.page.name }} (${{ matrix.network }})
        working-directory: tools/web-vitals-benchmark
        run: |
          mkdir -p merged-results
          echo "Merging lighthouse results for ${{ matrix.page.name }} (${{ matrix.network }})..."

          find ../../lighthouse-artifacts -name "*.json" -exec cp {} merged-results/ \;

          echo "Merged results:"
          ls -la merged-results/
          echo -e "\nTotal files merged: $(ls -1 merged-results/*.json 2>/dev/null | wc -l)"

          echo "Generating summary.json for ${{ matrix.page.name }} (${{ matrix.network }})..."
          rm -rf .lighthouseci
          mkdir -p .lighthouseci
          cp merged-results/lhr-*.json .lighthouseci/

          bun run dev > merged-results/summary.json

      - name: Upload merged results for ${{ matrix.page.name }} (${{ matrix.network }})
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-merged-results-${{ matrix.page.name }}-${{ matrix.network }}
          path: tools/web-vitals-benchmark/merged-results/
          retention-days: 1

  aggregate-cold-results:
    runs-on: ubuntu-latest
    needs: [setup, lighthouse]
    if: always() && inputs.mode == 'both'
    strategy:
      matrix:
        page: ${{ fromJSON(needs.setup.outputs.page-matrix) }}
        network: ${{ fromJSON(needs.setup.outputs.network-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: tools/web-vitals-benchmark
        run: bun install

      - name: Download cold artifacts for ${{ matrix.page.name }} (${{ matrix.network }})
        uses: actions/download-artifact@v4
        with:
          pattern: lighthouse-cold-results-${{ matrix.page.name }}-${{ matrix.network }}-*
          path: lighthouse-artifacts

      - name: Merge cold results for ${{ matrix.page.name }} (${{ matrix.network }})
        working-directory: tools/web-vitals-benchmark
        run: |
          mkdir -p merged-results
          echo "Merging cold lighthouse results for ${{ matrix.page.name }} (${{ matrix.network }})..."

          find ../../lighthouse-artifacts -name "*.json" -exec cp {} merged-results/ \;

          echo "Merged cold results:"
          ls -la merged-results/
          echo -e "\nTotal files merged: $(ls -1 merged-results/*.json 2>/dev/null | wc -l)"

          echo "Generating cold summary.json for ${{ matrix.page.name }} (${{ matrix.network }})..."
          rm -rf .lighthouseci
          mkdir -p .lighthouseci
          cp merged-results/lhr-*.json .lighthouseci/

          bun run dev > merged-results/summary.json

      - name: Upload cold merged results for ${{ matrix.page.name }} (${{ matrix.network }})
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-merged-results-cold-${{ matrix.page.name }}-${{ matrix.network }}
          path: tools/web-vitals-benchmark/merged-results/
          retention-days: 1

  aggregate-warm-results:
    runs-on: ubuntu-latest
    needs: [setup, lighthouse]
    if: always() && inputs.mode == 'both'
    strategy:
      matrix:
        page: ${{ fromJSON(needs.setup.outputs.page-matrix) }}
        network: ${{ fromJSON(needs.setup.outputs.network-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: tools/web-vitals-benchmark
        run: bun install

      - name: Download warm artifacts for ${{ matrix.page.name }} (${{ matrix.network }})
        uses: actions/download-artifact@v4
        with:
          pattern: lighthouse-warm-results-${{ matrix.page.name }}-${{ matrix.network }}-*
          path: lighthouse-artifacts

      - name: Merge warm results for ${{ matrix.page.name }} (${{ matrix.network }})
        working-directory: tools/web-vitals-benchmark
        run: |
          mkdir -p merged-results
          echo "Merging warm lighthouse results for ${{ matrix.page.name }} (${{ matrix.network }})..."

          find ../../lighthouse-artifacts -name "*.json" -exec cp {} merged-results/ \;

          echo "Merged warm results:"
          ls -la merged-results/
          echo -e "\nTotal files merged: $(ls -1 merged-results/*.json 2>/dev/null | wc -l)"

          echo "Generating warm summary.json for ${{ matrix.page.name }} (${{ matrix.network }})..."
          rm -rf .lighthouseci
          mkdir -p .lighthouseci
          cp merged-results/lhr-*.json .lighthouseci/

          bun run dev > merged-results/summary.json

      - name: Upload warm merged results for ${{ matrix.page.name }} (${{ matrix.network }})
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-merged-results-warm-${{ matrix.page.name }}-${{ matrix.network }}
          path: tools/web-vitals-benchmark/merged-results/
          retention-days: 1

  combine-results:
    runs-on: ubuntu-latest
    needs: [setup, aggregate-results]
    if: always() && inputs.mode != 'both'

    steps:
      - name: Download all merged results
        uses: actions/download-artifact@v4
        with:
          pattern: lighthouse-merged-results-*
          path: merged-artifacts

      - name: Organize results by page and network
        run: |
          PROJECT="${{ inputs.project }}"
          MODE="${{ inputs.mode || 'cold' }}"
          mkdir -p combined-results
          for dir in merged-artifacts/lighthouse-merged-results-*/; do
            BASENAME=$(basename "$dir" | sed 's/lighthouse-merged-results-//')
            # Format: {page}-{network}
            NETWORK=$(echo "$BASENAME" | rev | cut -d- -f1 | rev)
            PAGE_NAME=$(echo "$BASENAME" | rev | cut -d- -f2- | rev)
            mkdir -p "combined-results/${PROJECT}/${PAGE_NAME}/${MODE}/${NETWORK}"
            cp "$dir"summary.json "combined-results/${PROJECT}/${PAGE_NAME}/${MODE}/${NETWORK}/" 2>/dev/null || true
          done

          echo "Combined results structure:"
          find combined-results -type f

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-combined-results
          path: combined-results/
          retention-days: 1

  combine-all-results:
    runs-on: ubuntu-latest
    needs: [setup, aggregate-cold-results, aggregate-warm-results]
    if: always() && inputs.mode == 'both'

    steps:
      - name: Download all cold merged results
        uses: actions/download-artifact@v4
        with:
          pattern: lighthouse-merged-results-cold-*
          path: merged-artifacts-cold

      - name: Download all warm merged results
        uses: actions/download-artifact@v4
        with:
          pattern: lighthouse-merged-results-warm-*
          path: merged-artifacts-warm

      - name: Organize results by page, mode, and network
        run: |
          PROJECT="${{ inputs.project }}"
          mkdir -p combined-results
          for dir in merged-artifacts-cold/lighthouse-merged-results-cold-*/; do
            BASENAME=$(basename "$dir" | sed 's/lighthouse-merged-results-cold-//')
            # Format: {page}-{network}
            NETWORK=$(echo "$BASENAME" | rev | cut -d- -f1 | rev)
            PAGE_NAME=$(echo "$BASENAME" | rev | cut -d- -f2- | rev)
            mkdir -p "combined-results/${PROJECT}/${PAGE_NAME}/cold/${NETWORK}"
            cp "$dir"summary.json "combined-results/${PROJECT}/${PAGE_NAME}/cold/${NETWORK}/" 2>/dev/null || true
          done
          for dir in merged-artifacts-warm/lighthouse-merged-results-warm-*/; do
            BASENAME=$(basename "$dir" | sed 's/lighthouse-merged-results-warm-//')
            # Format: {page}-{network}
            NETWORK=$(echo "$BASENAME" | rev | cut -d- -f1 | rev)
            PAGE_NAME=$(echo "$BASENAME" | rev | cut -d- -f2- | rev)
            mkdir -p "combined-results/${PROJECT}/${PAGE_NAME}/warm/${NETWORK}"
            cp "$dir"summary.json "combined-results/${PROJECT}/${PAGE_NAME}/warm/${NETWORK}/" 2>/dev/null || true
          done

          echo "Combined results structure:"
          find combined-results -type f

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-combined-results
          path: combined-results/
          retention-days: 1

  publish-to-visualizer:
    runs-on: ubuntu-latest
    needs: [combine-results, combine-all-results]
    if: always() && !cancelled() && (needs.combine-results.result == 'success' || needs.combine-all-results.result == 'success')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download combined results
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-combined-results
          path: lighthouse-combined-results

      - name: Copy results to benchmark-visualizer data directory
        run: |
          DATA_DIR="tools/benchmark-visualizer/public/data"
          echo "Copying combined results to ${DATA_DIR}..."
          cp -r lighthouse-combined-results/. "${DATA_DIR}/"

          echo "Updated data directory structure:"
          find "${DATA_DIR}" -type f

      - name: Commit and push benchmark data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/benchmark-visualizer/public/data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update benchmark data for ${{ inputs.project }} [${{ inputs.mode || 'cold' }} mode] [${{ inputs.network || 'none' }} network] [skip ci]"
            git push
          fi
