name: Lighthouse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      url:
        description: "Custom URL to benchmark"
        required: false
        type: string

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        instance: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: tools/web-vitals-benchmark
        run: bun install

      - name: Run Lighthouse CI (Instance ${{ matrix.instance }})
        working-directory: tools/web-vitals-benchmark
        run: |
          if [ -n "${{ inputs.url }}" ]; then
            bun run lighthouse:ci --collect.url="${{ inputs.url }}"
          else
            bun run lighthouse:ci
          fi
        continue-on-error: true

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results-${{ matrix.instance }}
          path: tools/web-vitals-benchmark/.lighthouseci/
          include-hidden-files: true
          retention-days: 1

  aggregate-results:
    runs-on: ubuntu-latest
    needs: lighthouse
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: tools/web-vitals-benchmark
        run: bun install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: lighthouse-artifacts

      - name: Merge all results into single directory
        working-directory: tools/web-vitals-benchmark
        run: |
          mkdir -p merged-results
          echo "Merging all lighthouse results..."

          # Copy all JSON files from all artifacts into merged-results
          # lighthouse-artifacts is in the repo root, so we need to go up two directories
          find ../../lighthouse-artifacts -name "*.json" -exec cp {} merged-results/ \;

          echo "Merged results:"
          ls -la merged-results/

          echo -e "\nTotal files merged: $(ls -1 merged-results/*.json 2>/dev/null | wc -l)"

          echo "Generating summary.json..."
          # Copy merged results to .lighthouseci-mfe so index.ts can process them
          rm -rf .lighthouseci
          mkdir -p .lighthouseci
          cp merged-results/lhr-*.json .lighthouseci/

          # Generate summary
          bun run dev > merged-results/summary.json

      - name: Upload merged results
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-merged-results
          path: tools/web-vitals-benchmark/merged-results/
          retention-days: 1
