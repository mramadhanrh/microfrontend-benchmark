services:
  # Next.js application
  nextjs-app:
    container_name: mfe-web-app
    build:
      context: ../../../.. # Go up 3 levels to project root
      dockerfile: apps/microfrontend/mfe-web-app/docker/next/Dockerfile
    ports:
      - "3000:3000"
    networks:
      - demo-network
    environment:
      - NODE_ENV=production

  # Nginx reverse proxy
  nginx:
    image: nginx:1.23.3-alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/demo-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs-app
    networks:
      - demo-network

networks:
  demo-network:
    driver: bridge
